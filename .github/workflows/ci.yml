name: MySQL integrity contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-only
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pdisposable-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      MYSQL_PWD: disposable-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Load demo SQL and verify real engine constraints
        run: python scripts/verify_database.py --container '${{ job.services.mysql.id }}' --initialize-demo
      - uses: actions/upload-artifact@v4
        with:
          name: mysql-contract
          path: reports/local/mysql-contract.json
